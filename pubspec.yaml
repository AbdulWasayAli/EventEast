name: event_ease
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8


  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  provider: ^6.1.5+1


  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  
  url_launcher: ^6.3.2

  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  intl: ^0.19.0

  shared_preferences: ^2.3.2


  connectivity_plus: ^6.0.5

  flutter_rating_bar: ^4.0.1

  pdf: ^3.10.4
  printing: ^5.11.1
  share_plus: ^13.3.0
  http: ^1.6.0
  googleapis_auth: ^2.3.3

  flutter_local_notifications: ^18.0.1
  google_sign_in: 6.2.1

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/service-account.json
